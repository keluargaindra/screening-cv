<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Screening CV v2</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="email"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Screening CV Pelamar</h2>
    <form id="cvForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" required placeholder="Masukkan nama lengkap">
        </div>
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
            <label for="fileCv">Unggah CV (Format PDF, Maks 5MB)</label>
            <input type="file" id="fileCv" accept=".pdf" required>
        </div>
        <button type="submit" id="submitBtn">Kirim Data & CV</button>
    </form>
    <div id="message"></div>
</div>

<script>
    // GANTI TULISAN DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwLVjZ0lw0-R4Cp8tyFX841AxcPAjHFEvo82NUdYu-Zd06C4OIP8OLhp041C3UsaELM/exec';

    document.getElementById('cvForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const fileInput = document.getElementById('fileCv').files[0];
        
        // Validasi ukuran file (Maksimal 5MB)
        if (fileInput.size > 5 * 1024 * 1024) {
            alert('Ukuran file terlalu besar! Maksimal 5MB.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Mengunggah & Mengirim...';
        messageDiv.innerText = '';

        // Membaca file PDF dan mengubahnya ke Base64 string
        const reader = new FileReader();
        reader.readAsDataURL(fileInput);
        reader.onload = function () {
            const base64String = reader.result.split(',')[1]; // Ambil data bytes saja

            const dataPelamar = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                fileBytes: base64String,
                fileMimeType: fileInput.type
            };

            // Kirim ke Google Apps Script
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataPelamar)
            })
            .then(() => {
                messageDiv.className = 'success';
                messageDiv.innerText = '✓ Sukses! CV terunggah ke Drive & email konfirmasi telah dikirim.';
                document.getElementById('cvForm').reset();
            })
            .catch(error => {
                messageDiv.className = 'error';
                messageDiv.innerText = '❌ Gagal: ' + error.message;
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Kirim Data & CV';
            });
        };
    });
</script>

</body>
</html>
