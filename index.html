<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Screening CV</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="email"], input[type="url"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Screening CV Pelamar</h2>
    <form id="cvForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" required placeholder="Masukkan nama lengkap">
        </div>
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
            <label for="linkCv">Link Google Drive / LinkedIn CV</label>
            <input type="url" id="linkCv" required placeholder="https://google.com...">
        </div>
        <button type="submit" id="submitBtn">Kirim CV Saya</button>
    </form>
    <div id="message"></div>
</div>

<script>
    // GANTI TULISAN DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwwtHXUJ7vwC6WQY-3bPsHMz1p6_adl1MVIfAYMoZWeZuQeiLC7ZCOgVBxwmWTunafm/exec';

    document.getElementById('cvForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah halaman reload saat submit
        
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        // Ubah tombol menjadi loading
        submitBtn.disabled = true;
        submitBtn.innerText = 'Mengirim...';
        messageDiv.innerText = '';

        // Ambil data dari input form
        const dataPelamar = {
            nama: document.getElementById('nama').value,
            email: document.getElementById('email').value,
            linkCv: document.getElementById('linkCv').value
        };

        // Kirim data ke Google Apps Script menggunakan fetch API
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', // Diperlukan agar tidak terblokir CORS policy di browser lokal
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataPelamar)
        })
        .then(() => {
            // Karena menggunakan mode: 'no-cors', browser tidak bisa membaca JSON respons,
            // namun jika data masuk ke Google Sheets, proses dianggap sukses.
            messageDiv.className = 'success';
            messageDiv.innerText = '✓ CV Berhasil Terkirim! Silakan cek Google Sheets Anda.';
            document.getElementById('cvForm').reset(); // Reset form isi kembali kosong
        })
        .catch(error => {
            messageDiv.className = 'error';
            messageDiv.innerText = '❌ Gagal mengirim data: ' + error.message;
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Kirim CV Saya';
        });
    });
</script>

</body>
</html>
